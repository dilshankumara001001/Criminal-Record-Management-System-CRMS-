<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criminals - CRMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .btn { padding: 10px 24px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-family: 'Poppins', sans-serif; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, #4fc3f7, #0288d1); color: #fff; }
        .btn-primary:hover { transform: scale(1.05); box-shadow: 0 4px 20px rgba(79,195,247,0.4); }
        .btn-danger { background: #ef5350; color: #fff; }
        .btn-danger:hover { background: #c62828; }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        
        .table-container { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 14px 12px; font-weight: 600; color: #555; border-bottom: 2px solid #eee; font-size: 13px; text-transform: uppercase; }
        td { padding: 14px 12px; border-bottom: 1px solid #f5f5f5; font-size: 14px; color: #333; }
        tr:hover { background: #f8faff; }
        .status-badge { padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-badge.arrested { background: #ffebee; color: #c62828; }
        .status-badge.investigation { background: #fff3e0; color: #e65100; }
        .status-badge.released { background: #e8f5e9; color: #2e7d32; }
        .status-badge.wanted { background: #fce4ec; color: #880e4f; }
        .status-badge.court { background: #e3f2fd; color: #0d47a1; }
        .action-btns { display: flex; gap: 5px; }
        .action-btns .delete { background: #ffebee; color: #c62828; padding: 6px 12px; border-radius: 8px; cursor: pointer; border: none; font-size: 13px; transition: all 0.2s; }
        .action-btns .delete:hover { transform: scale(1.1); }
        
        .search-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .search-bar input { flex: 1; min-width: 200px; padding: 12px 18px; border: 2px solid #e8ecf1; border-radius: 12px; font-size: 14px; font-family: 'Poppins', sans-serif; }
        .search-bar input:focus { border-color: #4fc3f7; outline: none; box-shadow: 0 0 0 4px rgba(79,195,247,0.15); }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand"><i class="fas fa-shield-alt"></i><span>CRMS</span></div>
        <div class="sidebar-menu">
            <a href="index.html"><i class="fas fa-home"></i> <span>Dashboard</span></a>
            <a href="criminals.html" class="active"><i class="fas fa-user-cog"></i> <span>Criminals</span></a>
            <a href="complaints.html"><i class="fas fa-file-alt"></i> <span>Complaints</span></a>
            <a href="cases.html"><i class="fas fa-gavel"></i> <span>Cases</span></a>
            <a href="reports.html"><i class="fas fa-chart-bar"></i> <span>Reports</span></a>
        </div>
        <div class="sidebar-footer"><a href="logout.php"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></div>
    </div>

    <div class="main-content">
        <header class="navbar">
            <div class="navbar-left"><h1>Criminal Management</h1><span class="subtitle">Manage records</span></div>
            <div class="navbar-right"><span class="badge">Colombo HQ</span><div class="profile"><div class="avatar" id="userAvatar">A</div><span id="userName">Admin</span></div></div>
        </header>

        <div class="page-header">
            <h2><i class="fas fa-list"></i> Criminal Records</h2>
            <button class="btn btn-primary" onclick="addCriminal()"><i class="fas fa-plus"></i> Add New</button>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by name or NIC..." onkeyup="filterTable()">
        </div>

        <div class="table-container">
            <table>
                <thead><tr><th>#</th><th>Name</th><th>NIC</th><th>Status</th><th>Station</th><th>Actions</th></tr></thead>
                <tbody id="criminalTableBody">
                    <tr><td colspan="6" style="text-align:center;color:#888;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Check login
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) { window.location.href = 'login.html'; } else {
            document.getElementById('userName').textContent = user.full_name || 'Admin';
            document.getElementById('userAvatar').textContent = (user.full_name || 'A').charAt(0).toUpperCase();
        }

        function loadCriminals() {
            fetch('api/criminals.php')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('criminalTableBody');
                    tbody.innerHTML = '';
                    if (data.status === 'success' && data.data.length > 0) {
                        data.data.forEach((c, index) => {
                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td>${index + 1}</td>
                                <td><strong>${c.full_name}</strong></td>
                                <td>${c.nic || '-'}</td>
                                <td><span class="status-badge ${c.status}">${c.status.charAt(0).toUpperCase() + c.status.slice(1)}</span></td>
                                <td>${c.station_name || 'N/A'}</td>
                                <td>
                                    <div class="action-btns">
                                        <button class="delete" onclick="deleteCriminal(${c.criminal_id})"><i class="fas fa-trash"></i></button>
                                    </div>
                                </td>
                            `;
                            tbody.appendChild(row);
                        });
                    } else {
                        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888;">No records found</td></tr>';
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        function deleteCriminal(id) {
            if (!confirm('Are you sure you want to delete this criminal?')) return;
            fetch(`api/criminals.php?id=${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    alert(data.message);
                    loadCriminals();
                });
        }

        function addCriminal() {
            const name = prompt('Enter Full Name:');
            if (!name) return;
            const nic = prompt('Enter NIC:');
            const status = prompt('Enter Status (arrested/investigation/released/wanted/court):');
            
            fetch('api/criminals.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ full_name: name, nic: nic, status: status || 'investigation' })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                loadCriminals();
            });
        }

        function filterTable() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#criminalTableBody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(input) ? '' : 'none';
            });
        }

        loadCriminals();
    </script>
</body>
</html>
